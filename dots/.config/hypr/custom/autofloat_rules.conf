# Master Float: float all new windows (disabled by default, toggled via Super+F11)
windowrule {
    name = master_float
    match:class = .*
    enable = false

    float = on
}

# Default float size (excludes apps that should pick their own size)
windowrule {
    name = master_float_size
    match:class =
    match:title =
    enable = false

    size = 1400 900
}
