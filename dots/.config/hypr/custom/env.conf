# ######## Wayland #########
# Tearing
# env = WLR_DRM_NO_ATOMIC, 1
# ?
# env = WLR_NO_HARDWARE_CURSORS, 1

# ######## EDITOR #########
#https://wiki.archlinux.org/title/Category:Text_editors
# for example: vi nano nvim ...

env = EDITOR, kate

# ######## Firefox / GPU #########
# VA-API driver for hardware video decode (AMD radeonsi)
env = LIBVA_DRIVER_NAME, radeonsi
# Use EGL backend for Firefox VA-API (required for Wayland VA-API decode)
env = MOZ_WAYLAND_USE_VAAPI, 1

# ######## Input Fix #########
# Fix for Firefox Wayland dead keys (accents and backticks) in WhatsApp Web
env = GTK_IM_MODULE, xim
