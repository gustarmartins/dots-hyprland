# -----------------------------------------------------
# One UI — Samsung-style motion
# -----------------------------------------------------
# Smooth, cushioned, gently springy. Opens overshoot a
# touch then settle; closes accelerate away cleanly.
# Moderate durations (~350-450ms) for that "premium"
# Samsung feel. Horizontal workspace slide.
# -----------------------------------------------------

animations {
    enabled = true

    # Open/move: pull slightly past target (y=1.1) then settle. Samsung's signature soft spring.
    bezier = oneUiSpatial, 0.16, 1.1, 0.3, 1.0
    # Smooth deceleration for fades. No bounce.
    bezier = oneUiDecel, 0.25, 1, 0.3, 1
    # Close: ease-in, leaves the screen with intent.
    bezier = oneUiAccel, 0.4, 0, 0.9, 0.4
    # Constant speed for border cycling.
    bezier = liner, 1, 1, 1, 1

    # -- Window Animations --
    animation = windowsIn, 1, 4, oneUiSpatial, popin 85%
    animation = windowsOut, 1, 3, oneUiAccel, popin 90%
    animation = windowsMove, 1, 4, oneUiSpatial, slide
    animation = border, 1, 3, liner
    animation = borderangle, 1, 40, liner, once
    animation = fade, 1, 3, oneUiDecel
    animation = layersIn, 1, 4, oneUiSpatial, popin 88%
    animation = layersOut, 1, 3, oneUiAccel, popin 92%
    animation = fadeLayersIn, 1, 3, oneUiDecel
    animation = fadeLayersOut, 1, 3, oneUiDecel
    animation = workspaces, 1, 5, oneUiSpatial, slide
    animation = specialWorkspace, 1, 5, oneUiSpatial, slidevert
}
