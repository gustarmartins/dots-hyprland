# -----------------------------------------------------
# One UI — Samsung-style motion (verified from Home Up)
# -----------------------------------------------------
# Smooth, confident, deceleration-heavy WITHOUT bounce.
# The premium Samsung feel comes from LONG durations
# (~650ms spatial) with aggressive decel curves, not
# from overshoot/spring. The window arrives fast (~80%
# in 200ms) then gently settles over the remaining
# ~450ms. Horizontal workspace slide.
#
# Source: Galaxy S23 Ultra (dm3q) Home Up → Advanced
# Tuning → default values, June 2026.
# -----------------------------------------------------

animations {
    enabled = true

    # Window position: extreme decel, fast burst then gentle landing. NO overshoot.
    # Samsung default: cubic-bezier(0.2, 0.94, 0.05, 1.0)
    bezier = oneUiPosition, 0.2, 0.94, 0.05, 1.0
    # Window/icon alpha: instant decel, fully opaque almost immediately.
    # Samsung default: cubic-bezier(0.0, 1.0, 0.0, 1.0)
    bezier = oneUiAlpha, 0.0, 1.0, 0.0, 1.0
    # Home screen elements: standard decel for icon/wallpaper transforms.
    # Samsung default: cubic-bezier(0.4, 0.0, 0.0, 1.0)
    bezier = oneUiHome, 0.4, 0.0, 0.0, 1.0
    # Close: sharp ease-in, leaves the screen quickly without lingering.
    bezier = oneUiAccel, 0.3, 0, 1, 1
    # Constant speed for border cycling.
    bezier = liner, 1, 1, 1, 1

    # -- Window Animations --
    # speed=2 ≈ 500ms (closest to Samsung's 650ms in Hyprland's speed units)
    animation = windowsIn, 1, 6.5, oneUiPosition, popin 85%
    animation = windowsOut, 1, 1.5, oneUiAccel, popin 90%
    animation = windowsMove, 1, 5, oneUiPosition, slide
    animation = border, 1, 3, liner
    animation = borderangle, 1, 40, liner, once
    # Fades: speed=4 ≈ 250ms (Samsung's fast alpha)
    animation = fade, 1, 2.5, oneUiAlpha
    animation = fadeIn, 1, 2.5, oneUiAlpha
    animation = fadeOut, 1, 1.5, oneUiAccel
    animation = layersIn, 1, 4, oneUiPosition, popin 88%
    animation = layersOut, 1, 1.5, oneUiAccel, popin 92%
    animation = fadeLayersIn, 1, 4, oneUiAlpha
    animation = fadeLayersOut, 1, 4, oneUiAlpha
    # Workspace: Samsung page swipes are ~500-600ms, deliberate and smooth
    animation = workspaces, 1, 5, oneUiPosition, slide
    animation = specialWorkspace, 1, 5, oneUiPosition, slidevert
}
