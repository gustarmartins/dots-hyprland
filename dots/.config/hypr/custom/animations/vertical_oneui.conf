# -----------------------------------------------------
# One UI — Samsung-style motion (vertical workspaces)
# (verified from Home Up)
# -----------------------------------------------------
# Same confident decel feel as horizontal_oneui, but
# main workspace switch slides vertically.
#
# Source: Galaxy S23 Ultra (dm3q) Home Up → Advanced
# Tuning → default values, June 2026.
# -----------------------------------------------------

animations {
    enabled = true

    bezier = oneUiPosition, 0.2, 0.94, 0.05, 1.0
    bezier = oneUiAlpha, 0.0, 1.0, 0.0, 1.0
    bezier = oneUiHome, 0.4, 0.0, 0.0, 1.0
    bezier = oneUiAccel, 0.3, 0, 1, 1
    bezier = liner, 1, 1, 1, 1

    animation = windowsIn, 1, 6.5, oneUiPosition, popin 85%
    animation = windowsOut, 1, 1.5, oneUiAccel, popin 90%
    animation = windowsMove, 1, 5, oneUiPosition, slide
    animation = border, 1, 3, liner
    animation = borderangle, 1, 40, liner, once
    animation = fade, 1, 2.5, oneUiAlpha
    animation = fadeIn, 1, 2.5, oneUiAlpha
    animation = fadeOut, 1, 1.5, oneUiAccel
    animation = layersIn, 1, 4, oneUiPosition, popin 88%
    animation = layersOut, 1, 1.5, oneUiAccel, popin 92%
    animation = fadeLayersIn, 1, 4, oneUiAlpha
    animation = fadeLayersOut, 1, 4, oneUiAlpha
    animation = workspaces, 1, 5, oneUiPosition, slidevert
    animation = specialWorkspace, 1, 5, oneUiPosition, slide
}
