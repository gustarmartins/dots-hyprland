# -----------------------------------------------------
# iOS — Apple-style motion (vertical workspaces)
# -----------------------------------------------------
# Same smooth, near-no-bounce deceleration feel as
# horizontal_ios, but main workspace switch slides
# vertically.
# -----------------------------------------------------

animations {
    enabled = true

    bezier = iosDecel, 0.16, 1, 0.3, 1
    bezier = iosStandard, 0.42, 0, 0.58, 1
    bezier = iosSpring, 0.34, 1.02, 0.4, 1
    bezier = liner, 1, 1, 1, 1

    animation = windowsIn, 1, 3, iosSpring, popin 92%
    animation = windowsOut, 1, 3, iosStandard, popin 95%
    animation = windowsMove, 1, 3, iosDecel, slide
    animation = border, 1, 3, liner
    animation = borderangle, 1, 40, liner, once
    animation = fade, 1, 3, iosDecel
    animation = layersIn, 1, 3, iosDecel, popin 95%
    animation = layersOut, 1, 3, iosStandard, popin 96%
    animation = fadeLayersIn, 1, 3, iosDecel
    animation = fadeLayersOut, 1, 3, iosDecel
    animation = workspaces, 1, 4, iosDecel, slidevert
    animation = specialWorkspace, 1, 4, iosDecel, slide
}
