# Author: @gustarmartins
# -----------------------------------------------------
# SIGNATURE v2 — dynamic-speed showcase
# -----------------------------------------------------
# Speed lives in the first ~120ms, expression in the tail.
# Overshoot ONLY on popin (windows/layers in) where it
# can't expose gaps; workspaces/moves use steep pure
# decel — front-loaded glide, no edge artifacts on
# multi-monitor. Outgoing elements accelerate away.
# Vertical workspace slide.
# -----------------------------------------------------

animations {
    enabled = true

    # Pop-in hero: quick arrival, ~5% overshoot, settles. Safe only on scale.
    bezier = pop, 0.26, 1.12, 0.32, 1.0
    # Spatial decel: fast launch, no overshoot — workspaces, moves, slides.
    bezier = glide, 0.12, 0.92, 0.18, 1.0
    # Outgoing: still accelerating when it disappears.
    bezier = exit, 0.52, 0.03, 0.72, 0.30
    # easeOutQuint for opacity/border.
    bezier = settle, 0.20, 1.0, 0.30, 1.0
    bezier = liner, 1, 1, 1, 1

    # -- Windows --
    animation = windowsIn, 1, 3.6, pop, popin 78%
    animation = windowsOut, 1, 2.2, exit, popin 88%
    animation = windowsMove, 1, 3.2, glide, slide

    # -- Fades (children set explicitly so nothing leaks from base) --
    animation = fadeIn, 1, 3, settle
    animation = fadeOut, 1, 2.2, settle

    # -- Shell layers --
    animation = layersIn, 1, 2.8, pop, popin 87%
    animation = layersOut, 1, 2, exit, popin 92%
    animation = fadeLayersIn, 1, 2, settle
    animation = fadeLayersOut, 1, 1.8, settle

    # -- Workspaces --
    animation = workspaces, 1, 5.5, glide, slidevert
    animation = specialWorkspaceIn, 1, 4, glide, slide
    animation = specialWorkspaceOut, 1, 2.6, exit, slide

    # -- Misc --
    animation = border, 1, 3, settle
    animation = borderangle, 1, 40, liner, once
    animation = zoomFactor, 1, 3.2, settle
}
