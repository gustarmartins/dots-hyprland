# -----------------------------------------------------
# iOS — Apple-style motion
# -----------------------------------------------------
# Smooth, confident, deceleration-heavy with essentially
# no bounce. Snappier than One UI (~280-350ms). Clean
# popins, no exaggerated overshoot. Horizontal workspace
# slide.
# -----------------------------------------------------

animations {
    enabled = true

    # easeOutExpo-like: arrives fast, eases to a confident stop. The iOS hallmark.
    bezier = iosDecel, 0.16, 1, 0.3, 1
    # Symmetric ease-in-out for moves.
    bezier = iosStandard, 0.42, 0, 0.58, 1
    # Barely-there spring (y=1.02) — Apple's critically-damped feel.
    bezier = iosSpring, 0.34, 1.02, 0.4, 1
    bezier = liner, 1, 1, 1, 1

    # -- Window Animations --
    animation = windowsIn, 1, 3, iosSpring, popin 92%
    animation = windowsOut, 1, 3, iosStandard, popin 95%
    animation = windowsMove, 1, 3, iosDecel, slide
    animation = border, 1, 3, liner
    animation = borderangle, 1, 40, liner, once
    animation = fade, 1, 3, iosDecel
    animation = layersIn, 1, 3, iosDecel, popin 95%
    animation = layersOut, 1, 3, iosStandard, popin 96%
    animation = fadeLayersIn, 1, 3, iosDecel
    animation = fadeLayersOut, 1, 3, iosDecel
    animation = workspaces, 1, 4, iosDecel, slide
    animation = specialWorkspace, 1, 4, iosDecel, slidevert
}
