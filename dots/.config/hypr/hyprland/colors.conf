general {
    col.active_border = rgba(7b969477)
    col.inactive_border = rgba(324b4a55)
}

misc {
    background_color = rgba(091615FF)
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Google Sans Flex Medium, Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(091615FF)
        col.text = rgba(d7e5e4FF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(d7e5e4), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(d7e5e4), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(d7e5e4), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrule = border_color rgba(92d787AA) rgba(92d78777), match:pin 1
