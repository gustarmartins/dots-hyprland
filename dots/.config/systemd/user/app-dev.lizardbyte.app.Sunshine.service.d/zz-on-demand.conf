[Service]
ExecStartPre=
ExecStart=
ExecStart=%h/.local/bin/sunshine-session run
Restart=no
# The supervisor owns Sunshine's PID; detached games retain their own lifetime.
KillMode=process
TimeoutStopSec=20s
ExecStopPost=
ExecStopPost=-%h/.local/bin/sunshine-session cleanup
ExecStopPost=%h/.local/bin/sunshine-display restore
