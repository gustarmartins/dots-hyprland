# Persistent wallpaper-driven colors. This file is rendered atomically and
# leaves xterm indexes 16-255 untouched for color-rich TUIs.
include ~/.local/state/quickshell/user/generated/terminal/kitty-theme.conf

# ── Font ──
font_family      JetBrainsMono Nerd Font Mono
font_size 10

# ── Cursor ──
cursor_shape beam
cursor_beam_thickness 2
cursor_blink_interval 0.5
cursor_trail 8
cursor_trail_decay 0.05 0.3
cursor_trail_start_threshold 1

# ── Appearance ──
window_margin_width 16
window_padding_width 5
placement_strategy center
hide_window_decorations yes
background_opacity 0.78
dynamic_background_opacity yes
background_blur 80
dim_opacity 0.46

# ── Rendering ──
# VSync — prevents tearing
sync_to_monitor yes
# Balanced redraw/input batching for multiple streaming terminals.
repaint_delay 10
input_delay 3
# Retain the existing native Wayland keyboard/input preference.
wayland_enable_ime no

# ── Scrollback ──
# Interactive history is bounded per window; deeper history stays in the pager.
scrollback_lines 50000
# UTF-8 pager history in MB. Existing windows retain their current buffers.
scrollback_pager_history_size 64
wheel_scroll_multiplier 8.0
touch_scroll_multiplier 3.0

listen_on unix:@kitty-{kitty_pid}.sock

# ── Tabs ──
tab_bar_min_tabs 2

# ── Behavior ──
confirm_os_window_close -1
shell zsh
# Don't shell-check for updates
update_check_interval 0
allow_remote_control socket-only

# ── Mouse ──
# Disable middle-click paste (PRIMARY selection) everywhere
mouse_map middle release ungrabbed no_op
mouse_map middle press ungrabbed no_op
mouse_map shift+middle release ungrabbed no_op
mouse_map shift+middle press ungrabbed no_op
mouse_map middle release grabbed no_op
mouse_map middle press grabbed no_op

# ── Keybinds ──
map ctrl+c send_key ctrl+c
map ctrl+shift+c copy_to_clipboard
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down
map ctrl+shift+h show_scrollback
# ── Font Size: Universal (All Windows) ──
map ctrl+plus          change_font_size all +1
map ctrl+equal         change_font_size all +1
map ctrl+kp_add        change_font_size all +1
map ctrl+minus         change_font_size all -1
map ctrl+underscore    change_font_size all -1
map ctrl+kp_subtract   change_font_size all -1
map ctrl+0             change_font_size all 0
map ctrl+kp_0          change_font_size all 0

# ── Font Size: Per-Window Only (Current Window) ──
# Option A: Ctrl + Shift + (- / + / Backspace)
map ctrl+shift+minus        change_font_size current -1.0
map ctrl+shift+underscore   change_font_size current -1.0
map ctrl+shift+kp_subtract  change_font_size current -1.0
map ctrl+shift+equal        change_font_size current +1.0
map ctrl+shift+plus         change_font_size current +1.0
map ctrl+shift+kp_add       change_font_size current +1.0
map ctrl+shift+backspace    change_font_size current 0
map ctrl+shift+0            change_font_size current 0
map ctrl+shift+kp_0         change_font_size current 0

# Option B: Ctrl + Alt + (- / + / 0)
map ctrl+alt+minus          change_font_size current -1.0
map ctrl+alt+underscore     change_font_size current -1.0
map ctrl+alt+kp_subtract    change_font_size current -1.0
map ctrl+alt+equal          change_font_size current +1.0
map ctrl+alt+plus           change_font_size current +1.0
map ctrl+alt+kp_add         change_font_size current +1.0
map ctrl+alt+0              change_font_size current 0
map ctrl+alt+kp_0           change_font_size current 0
