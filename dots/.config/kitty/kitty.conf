# ── Font ──
font_family      JetBrainsMono Nerd Font Mono
font_size 12

# ── Cursor ──
cursor_shape beam
cursor_beam_thickness 2
cursor_blink_interval 0.5
cursor_trail 8
cursor_trail_decay 0.05 0.3
cursor_trail_start_threshold 1

# ── Appearance ──
window_margin_width 16
window_padding_width 5
placement_strategy center
hide_window_decorations yes
background_opacity 0.78
dynamic_background_opacity yes
background_blur 80
dim_opacity 0.46

# ── Rendering ──
# VSync — prevents tearing
sync_to_monitor yes
# Repaint up to 500×/sec (2ms). Maximizes smoothness.
repaint_delay 2
# Process input immediately with no batching delay (default: 3ms)
input_delay 0
# Disable Wayland IME — not needed and adds per-window D-Bus overhead on launch
wayland_enable_ime no

# ── Scrollback ──
# 400k lines ≈ ~40 MB per kitty (was 5M = ~500 MB, caused 1 GB swap in long sessions)
scrollback_lines 400000
# Pager-only history in MB; held in RAM (not disk as previously assumed). 0 disables.
scrollback_pager_history_size 128
wheel_scroll_multiplier 8.0
touch_scroll_multiplier 3.0

listen_on unix:@kitty-{kitty_pid}.sock

# ── Tabs ──
tab_bar_min_tabs 2

# ── Behavior ──
confirm_os_window_close 0
shell zsh
# Don't shell-check for updates
update_check_interval 0
allow_remote_control yes

# ── Mouse ──
# Disable middle-click paste (PRIMARY selection) everywhere
mouse_map middle release ungrabbed no_op
mouse_map middle press ungrabbed no_op
mouse_map shift+middle release ungrabbed no_op
mouse_map shift+middle press ungrabbed no_op
mouse_map middle release grabbed no_op
mouse_map middle press grabbed no_op

# ── Keybinds ──
map ctrl+left  send_text all \x1b[1;5D
map ctrl+right send_text all \x1b[1;5C
map ctrl+c    copy_or_interrupt
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map page_up    scroll_page_up
map page_down    scroll_page_down
map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
