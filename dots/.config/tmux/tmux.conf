# Conservative client capabilities: Kitty locally, standard xterm over SSH.
set -g default-terminal tmux-256color
set -g default-shell /usr/bin/zsh
set -as terminal-features ',xterm-kitty:RGB'
set -g mouse on
set -g history-limit 50000
set -s escape-time 50
set -s extended-keys on
set -s set-clipboard external
set -g focus-events on
set -g destroy-unattached off
set -g detach-on-destroy on
set -g renumber-windows off
setw -g automatic-rename off
set -g set-titles on
set -g set-titles-string '#S / #W'

# Readable on narrow mobile terminals; no polling commands in the status bar.
set -g status-style 'bg=default,fg=white'
set -g status-left '#[fg=cyan,bold]#S #[default]'
set -g status-left-length 24
set -g status-right '#[fg=colour245]%H:%M'
set -g status-right-length 8
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=cyan,bold] #I:#W #[default]'
set -g display-time 2000

# Keep the familiar Ctrl+B prefix. Splits inherit the current working directory.
bind '"' split-window -v -c '#{pane_current_path}'
bind '%' split-window -h -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind R source-file '~/.config/tmux/tmux.conf' \; display-message 'tmux configuration reloaded'
