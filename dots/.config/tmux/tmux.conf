# Conservative client capabilities: Kitty locally, standard xterm over SSH.
set -g default-terminal tmux-256color
set -g default-shell /usr/bin/zsh
set -as terminal-features ',xterm-kitty:RGB'
set -g mouse on
set -g history-limit 50000
set -s escape-time 50
set -s extended-keys on
set -s set-clipboard external
set -g focus-events on
set -g destroy-unattached off
set -g detach-on-destroy on
set -g renumber-windows off
setw -g automatic-rename off
set -g set-titles on
set -g set-titles-string '#S / #W'

# Readable on narrow mobile terminals; no polling commands in the status bar.
set -g status-style 'bg=default,fg=white'
set -g status-left '#[fg=cyan,bold][TMUX] #S #[default]'
set -g status-left-length 32
set -g status-right '#[fg=colour245]%H:%M'
set -g status-right-length 8
set -g status-interval 60
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=cyan,bold] #I:#W #[default]'
set -g display-time 2000

# Keep the familiar Ctrl+B prefix. Splits inherit the current working directory.
bind '"' split-window -v -c '#{pane_current_path}'
bind '%' split-window -h -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind R source-file '~/.config/tmux/tmux.conf' \; display-message 'tmux configuration reloaded'

# Session navigation without continuously redrawing a live preview.
bind s choose-tree -sNZ -O name
# Return from a held history view to the latest output.
bind End copy-mode -q \; refresh-client

# Local Kitty image paste also works in frontends restored before desktop login.
# The helper checks the live foreground process; new panes need no restore tag.
bind -n C-v run-shell -b '~/.local/bin/codex-paste-image --pane #{pane_id} --client-pid #{client_pid} --client-term #{q:client_termname}'

# Owner-requested Codex/Haven color parity, October 18, 2026.
# Explicit pane colors prevent a mobile terminal default foreground tint.
set -as terminal-features ",xterm-256color:RGB"
setw -g window-style "fg=#dae4ec,bg=#131d23"
setw -g window-active-style "fg=#dae4ec,bg=#131d23"
setw -g pane-colours[0] "#1f2329"
setw -g pane-colours[1] "#d91e70"
setw -g pane-colours[2] "#17a369"
setw -g pane-colours[3] "#9cae32"
setw -g pane-colours[4] "#2278a9"
setw -g pane-colours[5] "#736496"
setw -g pane-colours[6] "#2f9bba"
setw -g pane-colours[7] "#d7dae0"
setw -g pane-colours[8] "#5c6370"
setw -g pane-colours[9] "#ff3692"
setw -g pane-colours[10] "#00e990"
setw -g pane-colours[11] "#c7f678"
setw -g pane-colours[12] "#71acd3"
setw -g pane-colours[13] "#a890c3"
setw -g pane-colours[14] "#64dbff"
setw -g pane-colours[15] "#ffffff"

# Preserve failed panes and return crashes/OOM kills to an interactive shell.
# A normal exit still closes ordinary panes; Codex is never auto-restarted.
set -g remain-on-exit failed
set-hook -g pane-died[90] 'run-shell -b "~/.local/libexec/tmux-crash-shell.py #{pane_id}"'
