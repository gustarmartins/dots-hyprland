<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Managed by fontctl. Do not edit manually. -->
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>JetBrainsMono Nerd Font Mono</string></edit>
    <edit name="family" mode="append"><string>Symbols Nerd Font Mono</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>ui-monospace</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>JetBrainsMono Nerd Font Mono</string></edit>
    <edit name="family" mode="append"><string>Symbols Nerd Font Mono</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Readex Pro</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Readex Pro</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>ui-sans-serif</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Readex Pro</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>ui-rounded</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Readex Pro</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Readex Pro</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Readex Pro</string></edit>
  </match>
</fontconfig>
