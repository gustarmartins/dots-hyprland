# Optional mpv surround, controlled by its own service.
# Filter-chain config file for PipeWire version "1.4.8" #
#
# This is a base config file for running filters.
#
# Place filter fragments in /etc/pipewire/filter-chain.conf.d/
# for system-wide changes or in ~/.config/pipewire/filter-chain.conf.d/
# for local changes.
#
# Run the filters with pipewire -c filter-chain.conf
#

context.properties = {
    ## Configure properties in the system.
    #mem.warn-mlock  = false
    #mem.allow-mlock = true
    #mem.mlock-all   = false
    log.level        = 0
}

context.spa-libs = {
    #<factory-name regex> = <library-name>
    #
    # Used to find spa factory names. It maps an spa factory name
    # regular expression to a library name that should contain
    # that factory.
    #
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    #{ name = <module-name>
    #    ( args  = { <key> = <value> ... } )
    #    ( flags = [ ( ifexists ) ( nofail ) ] )
    #    ( condition = [ { <key> = <value> ... } ... ] )
    #}
    #
    # Loads a module with the given parameters.
    # If ifexists is given, the module is ignored when it is not found.
    # If nofail is given, module initialization failures are ignored.
    #
    # Uses realtime scheduling to boost the audio thread priorities
    { name = libpipewire-module-rt
        args = {
            #rt.prio      = 83
            #rt.time.soft = -1
            #rt.time.hard = -1
        }
        flags = [ ifexists nofail ]
    }

    # The native communication protocol.
    { name = libpipewire-module-protocol-native }

    # Allows creating nodes that run in the context of the
    # client. Is used by all clients that want to provide
    # data to PipeWire.
    { name = libpipewire-module-client-node }

    # Makes a factory for wrapping nodes in an adapter with a
    # converter and resampler.
    { name = libpipewire-module-adapter }

    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "MPV Spatial Audio (Binaural Surround)"
            media.name       = "MPV Spatial Audio (Binaural Surround)"
            filter.graph = {
                nodes = [
                    { type = builtin label = copy name = copyFL  }
                    { type = builtin label = copy name = copyFR  }
                    { type = builtin label = copy name = copyFC  }
                    { type = builtin label = copy name = copyRL  }
                    { type = builtin label = copy name = copyRR  }
                    { type = builtin label = copy name = copySL  }
                    { type = builtin label = copy name = copySR  }
                    { type = builtin label = copy name = copyLFE }

                    { type = builtin label = convolver name = convFL_L config = { filename = "/home/gus/.config/pipewire/hrir/spatial-atmos-7.1-48k.wav" channel =  0 } }
                    { type = builtin label = convolver name = convFL_R config = { filename = "/home/gus/.config/pipewire/hrir/spatial-atmos-7.1-48k.wav" channel =  1 } }
                    { type = builtin label = convolver name = convSL_L config = { filename = "/home/gus/.config/pipewire/hrir/spatial-atmos-7.1-48k.wav" channel =  2 } }
                    { type = builtin label = convolver name = convSL_R config = { filename = "/home/gus/.config/pipewire/hrir/spatial-atmos-7.1-48k.wav" channel =  3 } }
                    { type = builtin label = convolver name = convRL_L config = { filename = "/home/gus/.config/pipewire/hrir/spatial-atmos-7.1-48k.wav" channel =  4 } }
                    { type = builtin label = convolver name = convRL_R config = { filename = "/home/gus/.config/pipewire/hrir/spatial-atmos-7.1-48k.wav" channel =  5 } }
                    { type = builtin label = convolver name = convFC_L config = { filename = "/home/gus/.config/pipewire/hrir/spatial-atmos-7.1-48k.wav" channel =  6 } }
                    { type = builtin label = convolver name = convFR_R config = { filename = "/home/gus/.config/pipewire/hrir/spatial-atmos-7.1-48k.wav" channel =  7 } }
                    { type = builtin label = convolver name = convFR_L config = { filename = "/home/gus/.config/pipewire/hrir/spatial-atmos-7.1-48k.wav" channel =  8 } }
                    { type = builtin label = convolver name = convSR_R config = { filename = "/home/gus/.config/pipewire/hrir/spatial-atmos-7.1-48k.wav" channel =  9 } }
                    { type = builtin label = convolver name = convSR_L config = { filename = "/home/gus/.config/pipewire/hrir/spatial-atmos-7.1-48k.wav" channel = 10 } }
                    { type = builtin label = convolver name = convRR_R config = { filename = "/home/gus/.config/pipewire/hrir/spatial-atmos-7.1-48k.wav" channel = 11 } }
                    { type = builtin label = convolver name = convRR_L config = { filename = "/home/gus/.config/pipewire/hrir/spatial-atmos-7.1-48k.wav" channel = 12 } }
                    { type = builtin label = convolver name = convFC_R config = { filename = "/home/gus/.config/pipewire/hrir/spatial-atmos-7.1-48k.wav" channel = 13 } }

                    {
                        type  = builtin
                        label = mixer
                        name  = mixL
                        control = {
                            "Gain 1" = 1.0
                            "Gain 2" = 1.0
                            "Gain 3" = 1.0
                            "Gain 4" = 1.0
                            "Gain 5" = 1.0
                            "Gain 6" = 1.0
                            "Gain 7" = 1.0
                            "Gain 8" = 0.55
                        }
                    }
                    {
                        type  = builtin
                        label = mixer
                        name  = mixR
                        control = {
                            "Gain 1" = 1.0
                            "Gain 2" = 1.0
                            "Gain 3" = 1.0
                            "Gain 4" = 1.0
                            "Gain 5" = 1.0
                            "Gain 6" = 1.0
                            "Gain 7" = 1.0
                            "Gain 8" = 0.55
                        }
                    }
                ]
                links = [
                    { output = "copyFL:Out"  input = "convFL_L:In" }
                    { output = "copyFL:Out"  input = "convFL_R:In" }
                    { output = "copySL:Out"  input = "convSL_L:In" }
                    { output = "copySL:Out"  input = "convSL_R:In" }
                    { output = "copyRL:Out"  input = "convRL_L:In" }
                    { output = "copyRL:Out"  input = "convRL_R:In" }
                    { output = "copyFC:Out"  input = "convFC_L:In" }
                    { output = "copyFR:Out"  input = "convFR_R:In" }
                    { output = "copyFR:Out"  input = "convFR_L:In" }
                    { output = "copySR:Out"  input = "convSR_R:In" }
                    { output = "copySR:Out"  input = "convSR_L:In" }
                    { output = "copyRR:Out"  input = "convRR_R:In" }
                    { output = "copyRR:Out"  input = "convRR_L:In" }
                    { output = "copyFC:Out"  input = "convFC_R:In" }

                    { output = "convFL_L:Out" input = "mixL:In 1" }
                    { output = "convFL_R:Out" input = "mixR:In 1" }
                    { output = "convSL_L:Out" input = "mixL:In 2" }
                    { output = "convSL_R:Out" input = "mixR:In 2" }
                    { output = "convRL_L:Out" input = "mixL:In 3" }
                    { output = "convRL_R:Out" input = "mixR:In 3" }
                    { output = "convFC_L:Out" input = "mixL:In 4" }
                    { output = "convFC_R:Out" input = "mixR:In 4" }
                    { output = "convFR_R:Out" input = "mixR:In 5" }
                    { output = "convFR_L:Out" input = "mixL:In 5" }
                    { output = "convSR_R:Out" input = "mixR:In 6" }
                    { output = "convSR_L:Out" input = "mixL:In 6" }
                    { output = "convRR_R:Out" input = "mixR:In 7" }
                    { output = "convRR_L:Out" input = "mixL:In 7" }
                    { output = "copyLFE:Out"  input = "mixL:In 8" }
                    { output = "copyLFE:Out"  input = "mixR:In 8" }
                ]
                inputs  = [ "copyFL:In" "copyFR:In" "copyFC:In" "copyLFE:In" "copyRL:In" "copyRR:In" "copySL:In" "copySR:In" ]
                outputs = [ "mixL:Out" "mixR:Out" ]
            }
            capture.props = {
                node.name        = "effect_input.spatial-surround"
                media.class      = Audio/Sink
                audio.channels   = 8
                audio.position   = [ FL FR FC LFE RL RR SL SR ]
                priority.driver  = 0
                priority.session = 0
                node.virtual     = true
            }
            playback.props = {
                node.name          = "effect_output.spatial-surround"
                node.passive       = true
                stream.dont-remix  = true
                target.object      = "easyeffects_sink"
                audio.channels     = 2
                audio.position     = [ FL FR ]
            }
        }
    }

]
